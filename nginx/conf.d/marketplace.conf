# Marketplace — marketplace.devminds.net
upstream marketplace_backend {
    server marketplace-backend:4000;
    keepalive 16;
}

upstream marketplace_frontend {
    server marketplace-frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name marketplace.devminds.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    include /etc/nginx/conf.d/marketplace-proxy.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marketplace.devminds.net;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/conf.d/marketplace-proxy.inc;
}
