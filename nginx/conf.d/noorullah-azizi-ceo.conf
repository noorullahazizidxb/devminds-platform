# Noorullah CEO portfolios — noorullah-azizi-ceo.devminds.net
# Containers from noorullah-portfolio-deployment on devminds-net.
#   /     → elite (canonical)
#   /v1/  → classic (built with basePath=/v1; prefix stripped to upstream)
#   /v2/  → premium v2 (basePath=/v2)

upstream portfolio_elite {
    server noorullah-portfolio-elite:8080;
    keepalive 16;
}

upstream portfolio_v1 {
    server noorullah-portfolio-v1:8080;
    keepalive 8;
}

upstream portfolio_v2 {
    server noorullah-portfolio-v2:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name noorullah-azizi-ceo.devminds.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name noorullah-azizi-ceo.devminds.net;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health {
        proxy_pass http://portfolio_elite/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Longer prefixes first
    location /v1/ {
        proxy_pass http://portfolio_v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location = /v1 {
        return 301 /v1/;
    }

    location /v2/ {
        proxy_pass http://portfolio_v2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location = /v2 {
        return 301 /v2/;
    }

    location / {
        proxy_pass http://portfolio_elite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}
