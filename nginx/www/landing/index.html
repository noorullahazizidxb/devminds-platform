<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="DevMinds — choose Jobs or Marketplace" />
  <title>DevMinds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/logo.png" type="image/png" />
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="mesh"></div>
    <div class="beam beam-a"></div>
    <div class="beam beam-b"></div>
    <div class="grid"></div>
    <div class="noise"></div>
  </div>

  <main class="hero">
    <div class="brand fade-up">
      <img class="logo glow-pulse" src="/logo.png" alt="DevMinds" width="104" height="104" />
      <h1 class="wordmark">DevMinds</h1>
    </div>
    <p class="tagline fade-up delay-1">Where careers meet commerce.</p>
    <nav class="cta-group fade-up delay-2" aria-label="Destinations">
      <a class="cta" href="https://jobs.devminds.net">Searching for Jobs</a>
      <a class="cta cta-alt" href="https://marketplace.devminds.net">Rent or Sale</a>
    </nav>
  </main>
</body>
</html>
