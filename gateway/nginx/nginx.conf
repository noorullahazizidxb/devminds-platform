# Official nginx:* images compile stream + ssl_preread into the binary.
# Do NOT load_module them — Alpine packages do not ship those .so files and nginx will crash.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

# HTTPS SNI routing — populated from templates/*.stream-template at container start
# (official 20-envsubst-on-templates.sh when a stream {} block is present).
stream {
    include /etc/nginx/stream-conf.d/*.conf;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" host=$host';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP Host routing — populated from templates/*.template at container start.
    include /etc/nginx/conf.d/*.conf;
}
