# External edge gateway — owns host ports 80/443 and routes by hostname
# to app nginx containers on the shared public-proxy network:
#   newlinkaf-nginx, devminds-internal-nginx, portfolio-nginx, swagger-nginx
#
# Start (from this directory):
#   unset COMPOSE_PROJECT_NAME
#   docker network create public-proxy 2>/dev/null || true
#   docker compose --project-name edge-gateway up -d
#
# Prerequisites (each app is gateway-optional and has its own localhost ports):
#   1. DevMinds nginx → alias devminds-internal-nginx (8080/8443)
#   2. NewLinkAF nginx → alias newlinkaf-nginx (9080/9443)
#   3. Portfolio nginx → alias portfolio-nginx (9180/9444)
#   4. Swagger nginx → alias swagger-nginx (9280/9543)
#   5. Do NOT export COMPOSE_PROJECT_NAME=devminds-platform in this shell

name: edge-gateway

services:
  gateway-nginx:
    image: nginx:1.27-alpine
    container_name: edge-gateway-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Only substitute our upstream vars; leave nginx $host / $scheme etc. intact.
      NGINX_ENVSUBST_FILTER: "^(DEVMINDS_|NEWLINKAF_|PORTFOLIO_|SWAGGER_)"
      # Docker DNS names on the shared public-proxy network (NOT host.docker.internal —
      # Linux cannot reach 127.0.0.1-bound ports via the host-gateway IP).
      DEVMINDS_HTTP_UPSTREAM: ${DEVMINDS_HTTP_UPSTREAM:-devminds-internal-nginx:80}
      DEVMINDS_HTTPS_UPSTREAM: ${DEVMINDS_HTTPS_UPSTREAM:-devminds-internal-nginx:443}
      NEWLINKAF_HTTP_UPSTREAM: ${NEWLINKAF_HTTP_UPSTREAM:-newlinkaf-nginx:80}
      NEWLINKAF_HTTPS_UPSTREAM: ${NEWLINKAF_HTTPS_UPSTREAM:-newlinkaf-nginx:443}
      PORTFOLIO_HTTP_UPSTREAM: ${PORTFOLIO_HTTP_UPSTREAM:-portfolio-nginx:80}
      PORTFOLIO_HTTPS_UPSTREAM: ${PORTFOLIO_HTTPS_UPSTREAM:-portfolio-nginx:443}
      SWAGGER_HTTP_UPSTREAM: ${SWAGGER_HTTP_UPSTREAM:-swagger-nginx:80}
      SWAGGER_HTTPS_UPSTREAM: ${SWAGGER_HTTPS_UPSTREAM:-swagger-nginx:443}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - gateway-http-conf:/etc/nginx/conf.d
      - gateway-stream-conf:/etc/nginx/stream-conf.d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/gateway-health || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - edge-gateway-net
      - public-proxy

networks:
  edge-gateway-net:
    name: edge-gateway
    driver: bridge
  public-proxy:
    external: true
    name: public-proxy

volumes:
  gateway-http-conf:
  gateway-stream-conf:
