name: devminds-platform

services:
  mysql:
    image: mysql:8.4
    container_name: devminds-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - devminds-net

  redis:
    image: redis:7.4-alpine
    container_name: devminds-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - devminds-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: devminds-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - devminds-net

  jobs-backend:
    build:
      context: ../Jobs_Complete_Back-End-and-Front-End/job-service-back-end
      dockerfile: ../../devminds-platform/dockerfiles/jobs-backend.Dockerfile
    container_name: devminds-jobs-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL_JOBS}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET}
      ENABLE_ELASTIC_SEARCH: ${ENABLE_ELASTIC_SEARCH}
      ELASTICSEARCH_NODE: ${ELASTICSEARCH_NODE}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
      ES_INDEX_COMPANIES: ${ES_INDEX_COMPANIES}
      ES_INDEX_JOBS: ${ES_INDEX_JOBS}
      ES_INDEX_SERVICES: ${ES_INDEX_SERVICES}
      ES_INDEX_USERS: ${ES_INDEX_USERS}
      ES_INDEX_APPLICATIONS: ${ES_INDEX_APPLICATIONS}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-job-portal}
      RUN_SEEDS: ${RUN_SEEDS:-false}
      RUN_ES_REINDEX: ${RUN_ES_REINDEX:-false}
      GHOSTSCRIPT_ENABLED: ${GHOSTSCRIPT_ENABLED:-false}
    volumes:
      - jobs-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - devminds-net

  jobs-worker:
    build:
      context: ../Jobs_Complete_Back-End-and-Front-End/job-service-back-end
      dockerfile: ../../devminds-platform/dockerfiles/jobs-backend.Dockerfile
    container_name: devminds-jobs-worker
    restart: unless-stopped
    entrypoint: ["node", "./src/queue/imageProcessor.js"]
    command: []
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_JOBS}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      ENABLE_ELASTIC_SEARCH: ${ENABLE_ELASTIC_SEARCH}
      ELASTICSEARCH_NODE: ${ELASTICSEARCH_NODE}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-job-portal}
      GHOSTSCRIPT_ENABLED: ${GHOSTSCRIPT_ENABLED:-false}
    volumes:
      - jobs-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      jobs-backend:
        condition: service_started
    networks:
      - devminds-net

  jobs-frontend:
    build:
      context: ../Jobs_Complete_Back-End-and-Front-End/job-front-end
      dockerfile: ../../devminds-platform/dockerfiles/jobs-frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_JOBS_API_BASE:-https://jobs.devminds.net}
        NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_JOBS_API_BASE:-https://jobs.devminds.net}
        ELASTICSEARCH_NODE: ${ELASTICSEARCH_NODE:-http://elasticsearch:9200}
        AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET}
    container_name: devminds-jobs-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_JOBS_API_BASE:-https://jobs.devminds.net}
      NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_JOBS_API_BASE:-https://jobs.devminds.net}
      ELASTICSEARCH_NODE: ${ELASTICSEARCH_NODE}
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET}
    depends_on:
      - jobs-backend
    networks:
      - devminds-net

  marketplace-backend:
    build:
      context: ../MarketPlace_Back_end__Front_End/MarketPlace-Back-End-Node-Parisma
      dockerfile: ../../devminds-platform/dockerfiles/marketplace-backend.Dockerfile
    container_name: devminds-marketplace-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL_MARKETPLACE}
      REDIS_URL: ${REDIS_URL}
      TOKEN_SECRET: ${TOKEN_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      ENABLE_ELASTIC_SEARCH: ${ENABLE_ELASTIC_SEARCH}
      ELASTICSEARCH_NODE: ${ELASTICSEARCH_NODE}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX}
      ELASTICSEARCH_USERS_INDEX: ${ELASTICSEARCH_USERS_INDEX}
      ELASTICSEARCH_BLOGS_INDEX: ${ELASTICSEARCH_BLOGS_INDEX}
      RUN_SEEDS: ${RUN_SEEDS:-true}
      RUN_ES_REINDEX: ${RUN_ES_REINDEX:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      WHATSAPP_FROM: ${WHATSAPP_FROM}
    volumes:
      - marketplace-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - devminds-net

  marketplace-frontend:
    build:
      context: ../MarketPlace_Back_end__Front_End/marketplace-Front-end
      dockerfile: ../../devminds-platform/dockerfiles/marketplace-frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_MARKETPLACE_API_BASE:-https://marketplace.devminds.net/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_MARKETPLACE_WS_URL:-https://marketplace.devminds.net}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_MARKETPLACE_WS_URL:-https://marketplace.devminds.net}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_MARKETPLACE_SITE_URL:-https://marketplace.devminds.net}
        API_BASE: http://marketplace-backend:4000/api
        NEXT_PUBLIC_ENABLE_ELASTIC_SEARCH: ${NEXT_PUBLIC_ENABLE_ELASTIC_SEARCH:-true}
    container_name: devminds-marketplace-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_MARKETPLACE_API_BASE:-https://marketplace.devminds.net/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_MARKETPLACE_WS_URL:-https://marketplace.devminds.net}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_MARKETPLACE_WS_URL:-https://marketplace.devminds.net}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_MARKETPLACE_SITE_URL:-https://marketplace.devminds.net}
      API_BASE: http://marketplace-backend:4000/api
      NEXT_PUBLIC_ENABLE_ELASTIC_SEARCH: ${NEXT_PUBLIC_ENABLE_ELASTIC_SEARCH:-true}
    depends_on:
      - marketplace-backend
    networks:
      - devminds-net

  nginx:
    image: nginx:1.27-alpine
    container_name: devminds-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/www/landing:/var/www/landing:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - jobs-frontend
      - jobs-backend
      - marketplace-frontend
      - marketplace-backend
    networks:
      - devminds-net

networks:
  devminds-net:
    name: devminds-net
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  elastic-data:
  jobs-uploads:
  marketplace-uploads:

